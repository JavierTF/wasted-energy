<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #f7f5f0;
  --sidebar: #1a1a2e;
  --panel: #ffffff;
  --border: #e8e2d9;
  --text: #1a1a1a;
  --text2: #5a5a6a;
  --text3: #9a9aaa;
  --accent: #e8a020;
  --c1: #e8a020; --c2: #2db88a; --c3: #e05c8a;
  --c4: #6c5ce7; --c5: #0984e3; --c6: #e17055;
  --c7: #00b894; --c8: #d63031; --c9: #74b9ff;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── LEFT SIDEBAR ── */
#sidebar {
  width: 360px;
  min-width: 360px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.35s cubic-bezier(0.4,0,0.2,1), min-width 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
}

#sidebar.hidden {
  width: 0;
  min-width: 0;
  opacity: 0;
  pointer-events: none;
}

#sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#sidebar-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

#sidebar-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
  line-height: 1.3;
  flex: 1;
}

#sidebar-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  margin-top: 2px;
  font-weight: 300;
}

#lang-toggle {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
  margin-top: 2px;
}

.lang-btn {
  padding: 4px 10px;
  border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.4);
  transition: all 0.18s ease;
  line-height: 1.4;
}

.lang-btn.active { background: var(--accent); color: #fff; }
.lang-btn:not(.active):hover { color: rgba(255,255,255,0.75); }

#search-wrap {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: relative;
}

#search {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 7px 12px 7px 32px;
  color: rgba(255,255,255,0.85);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
}

#search::placeholder { color: rgba(255,255,255,0.3); }

.search-icon {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: rgba(255,255,255,0.3);
  pointer-events: none;
}

#tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 20px;
}

#tree::-webkit-scrollbar { width: 4px; }
#tree::-webkit-scrollbar-track { background: transparent; }
#tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

/* ── TREE NODES ── */
.branch { margin-bottom: 2px; }

.branch-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}

.branch-header:hover { background: rgba(255,255,255,0.06); }
.branch-header.active { background: rgba(255,255,255,0.1); }

.branch-accent { width: 3px; height: 20px; border-radius: 2px; flex-shrink: 0; }
.branch-emoji { font-size: 15px; flex-shrink: 0; width: 20px; text-align: center; }

.branch-label {
  font-size: 15px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  flex: 1;
  line-height: 1.3;
}

.branch-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.35);
  font-weight: 300;
  margin-top: 1px;
}

.branch-arrow {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  transition: transform 0.2s;
  flex-shrink: 0;
}

.branch-header.open .branch-arrow { transform: rotate(90deg); }
.branch-children { display: none; }
.branch-children.open { display: block; }

.child {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 44px;
  cursor: pointer;
  transition: background 0.12s;
  user-select: none;
}

.child:hover { background: rgba(255,255,255,0.05); }
.child.selected { background: rgba(255,255,255,0.12); }

.child-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

.child-label {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  flex: 1;
  line-height: 1.3;
  font-weight: 400;
}

.child-sub { font-size: 12px; color: rgba(255,255,255,0.28); font-weight: 300; }

.grandchild {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 6px 60px;
  cursor: pointer;
  transition: background 0.12s;
  user-select: none;
}

.grandchild:hover { background: rgba(255,255,255,0.04); }
.grandchild.selected { background: rgba(255,255,255,0.1); }
.grandchild-label { font-size: 13px; color: rgba(255,255,255,0.55); flex: 1; line-height: 1.3; }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#panel {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  background: var(--bg);
}

#panel::-webkit-scrollbar { width: 6px; }
#panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

#panel-map { width: 100%; }
.panel-breadcrumb {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  margin-bottom: 12px;
}

.panel-back-link {
  cursor: pointer;
  color: var(--accent);
  font-weight: 600;
  transition: opacity 0.15s;
  text-decoration: none;
  letter-spacing: 0.5px;
}

.panel-back-link:hover { opacity: 0.7; }

.panel-emoji { font-size: 36px; margin-bottom: 12px; display: block; }

.panel-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 8px;
}

.panel-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 28px; font-weight: 300; }
.panel-accent-bar { height: 3px; border-radius: 2px; width: 48px; margin-bottom: 28px; }
.panel-section { margin-bottom: 28px; }

.panel-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text3);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.panel-item {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.6;
}

.panel-item-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 4px;
}

.stat-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}

.stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}

.panel-warning {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: #fff5f5;
  border: 1px solid #fecaca;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #b91c1c;
  line-height: 1.5;
}

.panel-link {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  background: #f0fdf9;
  border: 1px solid #a7f3d0;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #047857;
  line-height: 1.5;
}

.panel-inner { padding: 36px 44px; }

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.detail-content { animation: fadeSlide 0.2s ease; }
.highlight { background: rgba(232,160,32,0.35); border-radius: 2px; }

.map-back-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 10px 16px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 6px;
  transition: background 0.15s;
}

.map-back-btn:hover { background: rgba(255,255,255,0.06); }

.map-back-btn.active { background: rgba(232,160,32,0.12); }

.map-back-icon {
  font-size: 15px;
  color: var(--accent);
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}

.map-back-label {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.2px;
}

.map-back-btn.active .map-back-label { color: var(--accent); }
</style>
</head>
<body>

<div id="sidebar">

  </div>
  <div id="search-wrap">

  </div>

</div>

<div id="main">

</div>

let currentLang = 'en';
let selectedId = null;
let openBranches = new Set(['root','r1','r3','r4','r5','r8','r9','r10','r11','r12','r13']);

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('search').placeholder = I18N[lang].searchPlaceholder;
  document.getElementById('search').value = '';
  document.getElementById('sidebar-title-text').textContent = I18N[lang].sidebarTitle;
  document.getElementById('sidebar-sub').textContent = I18N[lang].sidebarSub;
  renderTree();
  if (selectedId) {
    const node = findNode(selectedId, TREE_DATA[currentLang]);
    if (node) showPanel(node);
    else showMapStructure();
  } else {
    showMapStructure();
  }
}

function getTree() { return TREE_DATA[currentLang]; }

function buildTree(nodes, container, depth=0) {
  nodes.forEach(node => {
    const branch = document.createElement('div');
    branch.className = 'branch';
    branch.dataset.id = node.id;
    const color = COLORS[node.color] || '#888';
    const hasChildren = node.children && node.children.length > 0;

    if (depth === 0) {
      const header = document.createElement('div');
      header.className = 'branch-header' + (openBranches.has(node.id) ? ' open' : '') + (selectedId===node.id?' active':'');
      header.innerHTML = `
        <div class="branch-accent" style="background:${color}"></div>
        <span class="branch-emoji">${node.emoji}</span>
        <div style="flex:1">
          <div class="branch-label">${node.label}</div>
          ${node.sub?`<div class="branch-sub">${node.sub}</div>`:''}
        </div>
        ${hasChildren?`<span class="branch-arrow">▶</span>`:''}
      `;
      header.addEventListener('click', () => {
        if (hasChildren) {
          if (openBranches.has(node.id)) openBranches.delete(node.id);
          else openBranches.add(node.id);
          renderTree();
        }
        selectNode(node.id);
      });
      branch.appendChild(header);
      if (hasChildren) {
        const children = document.createElement('div');
        children.className = 'branch-children' + (openBranches.has(node.id)?' open':'');
        buildTree(node.children, children, depth+1);
        branch.appendChild(children);
      }
    } else if (depth === 1) {
      const child = document.createElement('div');
      child.className = 'child' + (selectedId===node.id?' selected':'');
      child.dataset.id = node.id;
      const hasGrand = node.children && node.children.length > 0;
      child.innerHTML = `
        <div class="child-dot" style="background:${color}"></div>
        <div style="flex:1">
          <div class="child-label">${node.emoji} ${node.label}</div>
          ${node.sub?`<div class="child-sub">${node.sub}</div>`:''}
        </div>
        ${hasGrand?`<span class="branch-arrow" style="font-size:8px;color:rgba(255,255,255,0.3)">${openBranches.has(node.id)?'▾':'▸'}</span>`:''}
      `;
      child.addEventListener('click', () => {
        if (hasGrand) {
          if (openBranches.has(node.id)) openBranches.delete(node.id);
          else openBranches.add(node.id);
          renderTree();
        }
        selectNode(node.id);
      });
      branch.appendChild(child);
      if (hasGrand) {
        const grand = document.createElement('div');
        grand.className = 'branch-children' + (openBranches.has(node.id)?' open':'');
        buildTree(node.children, grand, depth+1);
        branch.appendChild(grand);
      }
    } else {
      const gc = document.createElement('div');
      gc.className = 'grandchild' + (selectedId===node.id?' selected':'');
      gc.dataset.id = node.id;
      gc.innerHTML = `
        <div class="child-dot" style="background:${color};width:4px;height:4px"></div>
        <div class="grandchild-label">${node.emoji} ${node.label}</div>
      `;
      gc.addEventListener('click', () => selectNode(node.id));
      branch.appendChild(gc);
    }
    container.appendChild(branch);
  });
}

function renderTree() {
  const container = document.getElementById('tree');
  container.innerHTML = '';

  const mapBtn = document.createElement('div');
  mapBtn.className = 'map-back-btn' + (selectedId === null ? ' active' : '');
  mapBtn.innerHTML = `<span class="map-back-icon">⊞</span><span class="map-back-label">${currentLang === 'es' ? 'Vista general' : 'Overview'}</span>`;
  mapBtn.addEventListener('click', () => {
    selectedId = null;
    renderTree();
    showMapStructure();
  });
  container.appendChild(mapBtn);

  buildTree(getTree(), container, 0);
}

function findNode(id, nodes) {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) {
      const found = findNode(id, n.children);
      if (found) return found;
    }
  }
  return null;
}

function selectNode(id) {
  selectedId = id;
  renderTree();
  const node = findNode(id, getTree());
  if (node) showPanel(node);
}

function showPanel(node) {
  const panel = document.getElementById('panel');
  const d = node.detail;
  const color = COLORS[node.color] || '#888';

  const backLabel = currentLang === 'es' ? '← Vista general' : '← Overview';
  let html = `<div class="panel-inner"><div class="panel-content">`;
  html += `<div class="panel-breadcrumb"><span class="panel-back-link" onclick="selectedId=null;renderTree();showMapStructure()">${backLabel}</span> / ${d.breadcrumb}</div>`;
  html += `<span class="panel-emoji">${d.emoji}</span>`;
  html += `<div class="panel-title">${d.title}</div>`;
  if (d.sub) html += `<div class="panel-subtitle">${d.sub}</div>`;
  html += `<div class="panel-accent-bar" style="background:${color}"></div>`;

  d.sections.forEach(sec => {
    html += `<div class="panel-section">`;
    html += `<div class="panel-section-title">${sec.title}</div>`;
    if (sec.stats) {
      html += `<div class="stats-grid">`;
      sec.stats.forEach(s => {
        html += `<div class="stat-card"><div class="stat-label">${s.label}</div><div class="stat-val" style="color:${color}">${s.val}</div></div>`;
      });
      html += `</div>`;
    }
    if (sec.items) {
      sec.items.forEach(item => {
        const clean = item.replace(/^⚠️ /, '');
        if (sec.type === 'warning') {
          html += `<div class="panel-warning"><span>⚠</span><span>${clean}</span></div>`;
        } else if (sec.type === 'link') {
          html += `<div class="panel-link"><span>→</span><span>${clean}</span></div>`;
        } else {
          html += `<div class="panel-item"><div class="panel-item-dot" style="background:${color}"></div><span>${item}</span></div>`;
        }
      });
    }
    html += `</div>`;
  });

  html += `</div></div>`;
  panel.innerHTML = html;
  panel.scrollTop = 0;
}


function showMapStructure() {
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div id="panel-map">` + getMapSVG() + `</div>`;
  panel.scrollTop = 0;

function searchTree(q) {
  q = q.trim().toLowerCase();
  if (!q) { renderTree(); return; }

  function collectMatches(nodes, matches=[]) {
    nodes.forEach(n => {
      const text = (n.label + ' ' + (n.sub||'')).toLowerCase();
      if (text.includes(q)) matches.push(n.id);
      if (n.children) collectMatches(n.children, matches);
    });
    return matches;
  }

  function openParents(nodes, targetId, path=[]) {
    for (const n of nodes) {
      if (n.id === targetId) { path.forEach(p => openBranches.add(p)); return true; }
      if (n.children) { if (openParents(n.children, targetId, [...path, n.id])) return true; }
    }
    return false;
  }

  const matches = collectMatches(getTree());
  matches.forEach(id => openParents(getTree(), id));
  renderTree();

  document.querySelectorAll('.branch-label, .child-label, .grandchild-label').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.closest('.branch, .child, .grandchild').style.opacity = text.includes(q) ? '1' : '0.25';
  });
}

document.querySelectorAll('#lang-toggle .lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });

document.getElementById('search').addEventListener('input', function() { searchTree(this.value); });

setLang('en');
showMapStructure();
